name: Existing PNG preflight
on:
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python png_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: miri-preflight-report
          path: output/review/
          retention-days: 7
